substitutions:
  _SERVICE: babyshop-dashboard
  _APP_DIR: apps/babyshop-dashboard
  _REGION: europe-north1
  _REPO: apps
  _MAX_INSTANCES: "10"
  _MIN_INSTANCES: "0"   # bump to "1" for ~$5/mo to eliminate cold starts

steps:
  - id: syntax-check
    name: python:3.12-slim
    dir: ${_APP_DIR}
    entrypoint: bash
    args:
      - -c
      - find . -name "*.py" -not -path "./.venv/*" -print -exec python -m py_compile {} +

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: ${_APP_DIR}
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --max-instances=${_MAX_INSTANCES}
      - --min-instances=${_MIN_INSTANCES}
      - --set-env-vars=GCP_PROJECT=$PROJECT_ID

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

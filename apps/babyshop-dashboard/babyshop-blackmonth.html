<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Month · Babyshop</title>
  <link rel="icon" type="image/svg+xml" href="/babyshop-favicon.svg">
  <link rel="stylesheet" href="/brand.css">
  <script src="/chart.umd.js"></script>
  <style>
    /* Black theme: this page redeclares brand.css tokens, so the shared header
       and every token-driven rule go dark with it. Sections use ONLY these
       tokens — never a hard-coded colour. */
    :root {
      --bg:        #0B0B0C;
      --card:      #151517;
      --card-2:    #1C1C1F;
      --border:    #2A2A2E;
      --border-lt: #222226;
      --grid:      #26262A;
      --h:         #F4F4F5;
      --body:      #C9CAD0;
      --muted:     #8A8B93;
      --brand-ink: #F4F4F5;
      --brand-text:#C9CAD0;
      --accent:    #D8F799;      /* Babyshop campaign lime — the one bright accent */
      --accent-bg: #23291A;
      --accent-dark:#B9E36A;
      --up:        #5BD48A;
      --up-bg:     #12261A;
      --down:      #FF6B57;
      --down-bg:   #2C1512;
      --warn:      #F2B544;
      --warn-bg:   #2B2210;
      /* series */
      --s-actual:  #F4F4F5;
      --s-plan:    #D8F799;
      --s-ly:      #6B6C74;
      --s-fc:      #7FB6FF;
      /* markets */
      --m-se:      #7FB6FF;
      --m-no:      #FF8C7A;
      --m-fi:      #D8F799;
      --m-dk:      #C9A4FF;
      --m-row:     #8A8B93;
      --shadow-sm: none; --shadow: none;
      color-scheme: dark;
    }
    html, body { background: var(--bg); color: var(--body); }
    body { margin: 0; font-family: var(--font); }
    #app-header { background: #000 !important; border-bottom: 1px solid var(--border) !important; }
    #app-header .nav-tab, #app-header .nav-more-btn, #app-header .nav-cur-mobile { color: var(--body); }
    #app-header .nav-more.holds-current .nav-more-btn, #app-header .nav-tab:hover,
    #app-header .nav-more-btn:hover { color: var(--h); background: var(--card-2); }
    #app-header .nav-more.holds-current .nav-more-btn::after { background: var(--accent); }
    #app-header .nav-tab.nav-pin { background: var(--accent); color: #111; }
    #app-header .nav-tab.nav-pin.active { box-shadow: none; }
    #app-header .nav-burger span { background: var(--h); }
    .nav-menu a, .nav-palette-list a { color: var(--body); }
    .nav-menu a:hover, .nav-palette-list a.sel { background: var(--card-2); color: var(--h); }
    .nav-menu a[aria-current="page"], .nav-palette-list a[aria-current="page"] { color: var(--accent); }
    .nav-palette { background: rgba(0,0,0,.6); }
    #app-header img[src*="logo"] { filter: invert(1) brightness(2); }
    main { max-width: 1440px; margin: 0 auto; padding: 20px 24px 64px; }
    @media (max-width: 640px) { main { padding: 12px 16px 48px; } }

    .bm-hero { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .bm-hero h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: .02em; color: var(--h); }
    .bm-hero h1 b { color: var(--accent); font-weight: 600; }
    .bm-countdown { color: var(--muted); font-size: 14px; }
    .bm-countdown b { color: var(--h); }
    .bm-filters { display: flex; gap: 14px; flex-wrap: wrap; }
    .bm-filter { display: flex; gap: 4px; flex-wrap: wrap; }
    .bm-filter button { background: var(--card); color: var(--body); border: 1px solid var(--border); border-radius: 999px;
      padding: 5px 14px; font: inherit; font-size: 13px; cursor: pointer; }
    .bm-filter button.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

    .bm-nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; margin-bottom: 8px;
      display: flex; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border-lt); font-size: 13px; }
    .bm-nav a { color: var(--muted); text-decoration: none; }
    .bm-nav a:hover { color: var(--accent); }

    section.bm-section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin: 16px 0; scroll-margin-top: 48px; }
    section.bm-section > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    section.bm-section h2 { margin: 0; font-size: 17px; font-weight: 600; color: var(--h); }
    .bm-meta { color: var(--muted); font-size: 12px; }

    /* building blocks sections can use */
    .bm-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .bm-kpi { background: var(--card-2); border: 1px solid var(--border-lt); border-radius: 8px; padding: 12px 14px; }
    .bm-kpi .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .bm-kpi .val { color: var(--h); font-size: 24px; font-weight: 600; margin-top: 2px; }
    .bm-kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .bm-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .bm-grid-2 > * { min-width: 0; }   /* let wide tables scroll inside instead of widening the page */
    @media (max-width: 900px) { .bm-grid-2 { grid-template-columns: 1fr; } }
    .bm-chart { position: relative; height: 280px; }
    .bm-table-wrap { overflow-x: auto; }
    .bm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .bm-table th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); padding: 6px 8px; white-space: nowrap; }
    .bm-table td { border-bottom: 1px solid var(--border-lt); padding: 6px 8px; color: var(--body); }
    .bm-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .bm-table tr:hover td { background: var(--card-2); }
    .bm-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .bm-pill.up { background: var(--up-bg); color: var(--up); }
    .bm-pill.down { background: var(--down-bg); color: var(--down); }
    .bm-pill.warn { background: var(--warn-bg); color: var(--warn); }
    .bm-pill.muted { background: var(--card-2); color: var(--muted); }
    .bm-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .bm-error { color: var(--down); }
    h3 { color: var(--h); font-size: 14px; font-weight: 600; margin: 16px 0 8px; }
    .up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); } .muted { color: var(--muted); }
    /* "?" metric explanations (bm-core + bm-glossary.js) */
    .bm-q { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-left: 5px;
      border-radius: 50%; border: 1px solid var(--border); color: var(--muted); font-size: 10px; font-weight: 600;
      line-height: 1; cursor: help; vertical-align: middle; text-transform: none; letter-spacing: 0; user-select: none; }
    .bm-q:hover, .bm-q:focus { color: #111; background: var(--accent); border-color: var(--accent); outline: none; }
    .bm-tip { position: fixed; z-index: 50; display: none; max-width: min(340px, calc(100vw - 16px)); padding: 10px 12px;
      background: var(--card-2); color: var(--body); border: 1px solid var(--border); border-radius: 8px;
      font-size: 12.5px; line-height: 1.45; font-weight: 400; text-transform: none; letter-spacing: 0;
      box-shadow: 0 8px 24px rgba(0,0,0,.5); pointer-events: none; }
  </style>
</head>
<body>
<header id="app-header" data-page="blackmonth"></header>
<script src="/nav.js"></script>

<main>
  <div class="bm-hero">
    <div>
      <h1><b>Black</b> Month · November 2026</h1>
      <div class="bm-countdown" id="bm-countdown"></div>
    </div>
    <div class="bm-filters">
    <div class="bm-filter" role="group" aria-label="Brand">
      <button data-brand="all">Both brands</button>
      <button data-brand="babyshop">Babyshop</button>
      <button data-brand="lekmer">Lekmer</button>
    </div>
    <div class="bm-filter" role="group" aria-label="Market">
      <button data-market="all">All</button>
      <button data-market="SE">SE</button>
      <button data-market="NO">NO</button>
      <button data-market="FI">FI</button>
      <button data-market="DK">DK</button>
    </div>
    </div>
  </div>

  <nav class="bm-nav">
    <a href="#bm-pacing">Pacing &amp; forecast</a>
    <a href="#bm-paid">Paid media levers</a>
    <a href="#bm-creatives">Creatives</a>
    <a href="#bm-offers">Offers &amp; stock</a>
    <a href="#bm-insights">Today's actions</a>
  </nav>

  <!-- One <section> per bm_common.SECTIONS key; bm-core fetches each one. Results first, actions last. -->
  <section class="bm-section" id="bm-pacing"><header><h2>Pacing &amp; forecast</h2><span class="bm-meta"></span></header><div class="bm-body"></div></section>
  <section class="bm-section" id="bm-paid"><header><h2>Paid media levers</h2><span class="bm-meta"></span></header><div class="bm-body"></div></section>
  <section class="bm-section" id="bm-creatives"><header><h2>Creatives</h2><span class="bm-meta"></span></header><div class="bm-body"></div></section>
  <section class="bm-section" id="bm-offers"><header><h2>Offers &amp; stock</h2><span class="bm-meta"></span></header><div class="bm-body"></div></section>
  <section class="bm-section" id="bm-insights"><header><h2>Today's actions</h2><span class="bm-meta"></span></header><div class="bm-body"></div></section>
</main>

<script src="/bm-core.js"></script>
<script src="/bm-glossary.js"></script>
<script>
  (function () {
    var bf = new Date('2026-11-27T00:00:00+01:00'), now = new Date();
    var d = Math.ceil((bf - now) / 864e5);
    var el = document.getElementById('bm-countdown');
    if (d > 0) el.innerHTML = '<b>' + d + '</b> days to Black Friday (27 Nov) · Cyber Monday 30 Nov';
    else if (d > -4) el.innerHTML = '<b>Black Week is live</b> · Cyber Monday 30 Nov';
    else el.textContent = 'Black Friday weekend is over';
  })();
</script>
<!-- Section renderers. Missing files just 404 and the section says "Not built yet". -->
<script src="/bm-insights.js"></script>
<script src="/bm-pacing.js"></script>
<script src="/bm-paid.js"></script>
<script src="/bm-creatives.js"></script>
<script src="/bm-offers.js"></script>
<script>BM.start();</script>
</body>
</html>
